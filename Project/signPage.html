<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In Page</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/732/732228.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="backGround">
        <div class="cover"></div>

        <div class="logo">
            <a href="homePage.html">
                <img src=https://wallpapers.com/images/featured/netflix-logo-png-fqwt81hprrz7xsfg.jpg alt="Netflix">
            </a>
        </div>

        <div class="signinBox">
            <h2>Sign In</h2>
            <form>
                <input type="email" placeholder="Email or phone number" required><br>
                <input type="password" placeholder="Password" required><br>
                <button class="signBtn">Sign In</button>

                <p class="para">OR</p>
                <button class="use">Use a sign-in code </button>

                <a href="#">Forgot password?</a>


                <input type="checkbox" class="remember-me"> Remember me

                <p class="signupText">New to Netflix? <a href="signupPage.html">Sign up now</a>.</p>


                
                <p class="line2">
                    This page is protected by Google reCAPTCHA to ensure you're not a bot.
                    <a href="#" class="learnMore">Learn more.</a>
                </p>



            </form>
        </div>
    </div>


    <!-- footer part-->


    <div class="row1">
        <div class="Contact1">
            Questions? Call 000-800-919-1743(Toll-Free)
        </div>

        <div class="parts1">
            <div class="box"><a href="faqPage.html">FAQ</a></div>
            <div class="box"><a href="#">Help Centre</a></div>
            <div class="box"><a href="termsPage.html">Terms of Use</a></div>
            <div class="box"><a href="#">Privacy</a></div>
        </div>

        <div class="parts1">
            <div class="box"><a href="#">Cookie Preferences</a></div>
            <div class="box"><a href="corporatePage.html">Corporate Information</a></div>
        </div>

        <div class="langBtn">
            <select id="language" name="language">
                <option value="English">文 English</option>
                <option value="हिन्दी">हिन्दी</option>
            </select>
        </div>

    </div>


</body>

</html>
